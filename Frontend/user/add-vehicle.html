<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle | ORVBA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f8fc;
            color: #26344d;
        }

        nav {
            background: white;
            padding: 20px 7%;
            border-bottom: 1px solid #e5eaf2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #172b4d;
        }

        nav a {
            text-decoration: none;
            color: #526078;
            font-size: 14px;
        }

        .container {
            max-width: 650px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #4b79bb;
            text-decoration: none;
            font-size: 14px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #778198;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 32px;
            border: 1px solid #e7ebf2;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(23, 43, 77, 0.04);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            background: #fcfdff;
            color: #26344d;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #328ff0;
        }

        .gradient-button {
            position: relative;
            display: inline-block;
            padding: 2px;
            border: none;
            border-radius: 10px;
            background: #172b4d;
            cursor: pointer;
            transition: transform 0.3s;
            overflow: hidden;
        }

        .gradient-button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, #28d7db, #328ff0, #8869ee);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gradient-button:hover::before {
            opacity: 1;
        }

        .gradient-button:hover {
            transform: scale(1.03);
        }

        .button-inner {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            background: #172b4d;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .button-arrow {
            font-size: 19px;
            transition: transform 0.3s;
        }

        .gradient-button:hover .button-arrow {
            transform: translateX(4px);
        }

        .cancel-button {
            padding: 14px 20px;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            background: white;
            color: #526078;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 13px;
            border-radius: 8px;
            background: #e9f8f0;
            color: #24764e;
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: #8992a4;
            font-size: 13px;
            padding: 30px 15px;
        }

        @media (max-width: 600px) {
            nav {
                padding: 18px 5%;
            }

            .container {
                margin-top: 35px;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">ORVBA</div>
        <a href="vehicle.html">My Vehicles</a>
    </nav>

    <main class="container">

        <a href="vehicle.html" class="back-link">
            ← Back to My Vehicles
        </a>

        <h1 id="pageTitle">Add a Vehicle</h1>

        <p class="subtitle">
            Enter your vehicle details to register it with ORVBA.
        </p>

        <div class="form-card">

            <form id="vehicleForm">

                <div class="form-group">
                    <label for="vehicleType">Vehicle Type</label>

                    <select id="vehicleType" required>
                        <option value="">Select vehicle type</option>
                        <option value="Two Wheeler">Two Wheeler</option>
                        <option value="Car">Car</option>
                        <option value="SUV">SUV</option>
                        <option value="Van">Van</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="registrationNumber">
                        Registration Number
                    </label>

                    <input
                        type="text"
                        id="registrationNumber"
                        placeholder="e.g. TN 01 AB 1234"
                        maxlength="15"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="brand">Brand</label>

                    <input
                        type="text"
                        id="brand"
                        placeholder="e.g. Honda, Hyundai, Tata"
                        maxlength="40"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="model">Model</label>

                    <input
                        type="text"
                        id="model"
                        placeholder="e.g. Activa, i20, Nexon"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="buttons">

                    <button type="submit" class="gradient-button">
                        <span class="button-inner">
                            <span id="buttonText">Save Vehicle</span>
                            <span class="button-arrow">›</span>
                        </span>
                    </button>

                    <a href="vehicle.html" class="cancel-button">
                        Cancel
                    </a>

                </div>

                <p id="message"></p>

            </form>

        </div>

    </main>

    <footer>
        © 2026 ORVBA · On-Road Vehicle Breakdown Assistance
    </footer>

 <script>
    const API_BASE_URL = "http://localhost:8080";

    const form = document.getElementById("vehicleForm");
    const message = document.getElementById("message");
    const buttonText = document.getElementById("buttonText");

    function getAuthToken() {
        return localStorage.getItem("orvbaToken")
            || sessionStorage.getItem("orvbaToken");
    }

    function showMessage(text, isError = false) {
        message.style.display = "block";
        message.textContent = text;
        message.style.background = isError ? "#fdeaea" : "#e9f8f0";
        message.style.color = isError ? "#c0392b" : "#24764e";
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const token = getAuthToken();

        if (!token) {
            showMessage("Please log in before registering a vehicle.", true);
            return;
        }

        // Match the field names in your Spring Boot Vehicle entity.
        const vehicle = {
            vehicleType: document.getElementById("vehicleType").value,
            vehicleNumber: document.getElementById("registrationNumber")
                .value.trim().toUpperCase(),
            brand: document.getElementById("brand").value.trim(),
            model: document.getElementById("model").value.trim()
        };

        if (
            !vehicle.vehicleType ||
            !vehicle.vehicleNumber ||
            !vehicle.brand ||
            !vehicle.model
        ) {
            showMessage("Please fill in all four fields.", true);
            return;
        }

        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.style.opacity = "0.6";
        buttonText.textContent = "Saving...";

        try {
            const response = await fetch(`${API_BASE_URL}/vehicles`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/json"
                },
                body: JSON.stringify(vehicle)
            });

            if (response.status === 401 || response.status === 403) {
                showMessage(
                    "Your session is invalid or expired. Please log in again.",
                    true
                );
                return;
            }

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Backend error:", errorText);

                throw new Error(
                    "Could not save the vehicle. Server status: "
                    + response.status
                );
            }

            showMessage("Vehicle registered successfully!");

            // Return to the list after a successful save.
            setTimeout(function () {
                window.location.href = "vehicle.html";
            }, 1000);

        } catch (error) {
            console.error("Error registering vehicle:", error);

            showMessage(
                "Unable to connect to the backend. Check that Spring Boot is running.",
                true
            );

        } finally {
            submitButton.disabled = false;
            submitButton.style.opacity = "1";
            buttonText.textContent = "Save Vehicle";
        }
    });
</script>
</body>
</html>
