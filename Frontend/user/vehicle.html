<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles | ORVBA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f8fc;
            color: #26344d;
        }

        nav {
            background: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5eaf2;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #172b4d;
        }

        nav a {
            text-decoration: none;
            color: #526078;
            margin-left: 22px;
            font-size: 14px;
        }

        .container {
            max-width: 1050px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #778198;
            line-height: 1.6;
        }

        .gradient-button {
            position: relative;
            display: inline-block;
            padding: 2px;
            border: none;
            border-radius: 10px;
            background: #172b4d;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s;
            overflow: hidden;
        }

        .gradient-button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                100deg, #28d7db, #328ff0, #8869ee
            );
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gradient-button:hover::before {
            opacity: 1;
        }

        .gradient-button:hover {
            transform: scale(1.03);
        }

        .button-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 19px;
            border-radius: 8px;
            background: #172b4d;
            color: white;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .vehicle-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .vehicle-card {
            background: white;
            padding: 25px;
            border: 1px solid #e7ebf2;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(23, 43, 77, 0.04);
        }

        .vehicle-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .vehicle-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #eaf4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .vehicle-type {
            background: #e9f8f5;
            color: #23816e;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
        }

        .vehicle-card h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .registration {
            color: #778198;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .vehicle-details {
            border-top: 1px solid #edf0f5;
            padding-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 12px 0;
            font-size: 14px;
        }

        .detail-row span:first-child {
            color: #778198;
        }

        .detail-row span:last-child {
            font-weight: 600;
            text-align: right;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .small-button {
            padding: 9px 16px;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            background: white;
            color: #26344d;
            cursor: pointer;
            font-size: 13px;
        }

        .small-button:hover {
            background: #f1f6fc;
        }

        .empty-state {
            text-align: center;
            background: white;
            border: 1px solid #e7ebf2;
            border-radius: 15px;
            padding: 55px 20px;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 18px;
        }

        .empty-state h2 {
            margin-bottom: 12px;
        }

        .empty-state p {
            color: #778198;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .message {
            text-align: center;
            background: white;
            border: 1px solid #e7ebf2;
            border-radius: 15px;
            padding: 40px 20px;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            color: #8992a4;
            font-size: 13px;
            padding: 30px 15px;
            margin-top: 45px;
        }

        @media (max-width: 700px) {
            nav {
                padding: 18px 5%;
                flex-wrap: wrap;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
            }

            .container {
                margin-top: 35px;
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .vehicle-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">ORVBA</div>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="vehicle.html">My Vehicles</a>
            <a href="request.html">Get Assistance</a>
            <a href="../index.html" onclick="return logoutUser()">Logout</a>
        </div>
    </nav>

    <main class="container">

        <div class="heading">
            <div>
                <h1>My Vehicles</h1>
                <p class="subtitle">
                    View and manage your registered vehicles.
                </p>
            </div>

            <a href="add-vehicle.html" class="gradient-button">
                <span class="button-inner">
                    <span>＋</span>
                    <span>Add Vehicle</span>
                </span>
            </a>
        </div>

        <div id="vehicleList" class="vehicle-list">
            <div class="message">Loading your vehicles...</div>
        </div>

    </main>

    <footer>
        © 2026 ORVBA · On-Road Vehicle Breakdown Assistance
    </footer>

    <script>
        const API_BASE_URL = "http://localhost:8080";

        // Retrieve the JWT token saved during login.
        function getAuthToken() {
            return localStorage.getItem("orvbaToken")
                || sessionStorage.getItem("orvbaToken");
        }

        // Prevent values from the API being interpreted as HTML.
        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function showMessage(message, isError = false) {
            const vehicleList = document.getElementById("vehicleList");

            vehicleList.className = "vehicle-list";

            vehicleList.innerHTML = `
                <div class="message">
                    <div class="empty-icon">
                        ${isError ? "⚠️" : "⏳"}
                    </div>
                    <h2>
                        ${isError ? "Unable to load vehicles" : "Loading vehicles"}
                    </h2>
                    <p class="subtitle">${escapeHtml(message)}</p>

                    ${isError ? `
                        <button class="small-button"
                                onclick="loadVehicles()">
                            Try Again
                        </button>
                    ` : ""}
                </div>
            `;
        }

        // Fetch vehicles belonging to the authenticated user.
        async function loadVehicles() {
            const token = getAuthToken();

            if (!token) {
                showMessage(
                    "Your session has expired. Please log in again.",
                    true
                );

                setTimeout(function () {
                    window.location.href = "../login.html";
                }, 1200);

                return;
            }

            showMessage(
                "Please wait while we retrieve your registered vehicles."
            );

            try {
                const response = await fetch(
                    `${API_BASE_URL}/vehicles/my-vehicles`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Accept": "application/json"
                        }
                    }
                );

                if (response.status === 401 || response.status === 403) {
                    showMessage(
                        "Your session is invalid or has expired. Please log in again.",
                        true
                    );
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "Server returned status " + response.status
                    );
                }

                const vehicles = await response.json();

                if (!Array.isArray(vehicles)) {
                    throw new Error("Unexpected response from the server.");
                }

                displayVehicles(vehicles);

            } catch (error) {
                console.error("Error loading vehicles:", error);

                showMessage(
                    "Please check that the backend is running and try again.",
                    true
                );
            }
        }

        // Display vehicles returned by Spring Boot.
        function displayVehicles(vehicles) {
            const vehicleList = document.getElementById("vehicleList");

            vehicleList.innerHTML = "";

            if (vehicles.length === 0) {
                vehicleList.className = "";

                vehicleList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🚗</div>

                        <h2>No vehicles added yet</h2>

                        <p>
                            Register your vehicle to make requesting
                            roadside assistance easier.
                        </p>

                        <a href="add-vehicle.html" class="gradient-button">
                            <span class="button-inner">
                                <span>＋ Add Your First Vehicle</span>
                                <span>›</span>
                            </span>
                        </a>
                    </div>
                `;

                return;
            }

            vehicleList.className = "vehicle-list";

            vehicles.forEach(function (vehicle) {
                const vehicleType = vehicle.vehicleType || "Vehicle";
                const brand = vehicle.brand || "";
                const model = vehicle.model || "";

                // Backend field: vehicleNumber
                // Older frontend field: registrationNumber
                const registrationNumber =
                    vehicle.vehicleNumber
                    || vehicle.registrationNumber
                    || "Not provided";

                const icon = /two|bike|motorcycle|scooter/i.test(vehicleType)
                    ? "🛵"
                    : "🚗";

                vehicleList.innerHTML += `
                    <div class="vehicle-card">

                        <div class="vehicle-top">
                            <div class="vehicle-icon">${icon}</div>

                            <span class="vehicle-type">
                                ${escapeHtml(vehicleType)}
                            </span>
                        </div>

                        <h2>
                            ${escapeHtml((brand + " " + model).trim() || "My Vehicle")}
                        </h2>

                        <p class="registration">
                            ${escapeHtml(registrationNumber)}
                        </p>

                        <div class="vehicle-details">

                            <div class="detail-row">
                                <span>Vehicle Type</span>
                                <span>${escapeHtml(vehicleType)}</span>
                            </div>

                            <div class="detail-row">
                                <span>Brand</span>
                                <span>${escapeHtml(brand || "—")}</span>
                            </div>

                            <div class="detail-row">
                                <span>Model</span>
                                <span>${escapeHtml(model || "—")}</span>
                            </div>

                        </div>

                        <div class="actions">
                            <span class="subtitle">
                                Vehicle ID: ${escapeHtml(vehicle.vehicleId ?? "—")}
                            </span>
                        </div>

                    </div>
                `;
            });
        }

        function logoutUser() {
            if (!confirm("Are you sure you want to logout?")) {
                return false;
            }

            const keys = [
                "orvbaToken",
                "orvbaRole",
                "orvbaRefreshToken",
                "orvbaUsername"
            ];

            keys.forEach(function (key) {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            });

            return true;
        }

        // Load vehicles when the page opens.
        loadVehicles();
    </script>

</body>
</html>
